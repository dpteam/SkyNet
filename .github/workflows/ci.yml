name: ci

# The point of this workflow is not a green badge.  It is the three things
# that cannot be checked on one developer machine:
#   1. does the core really build with compilers other than the author's;
#   2. does the 32-bit build RUN and pass, not merely compile;
#   3. does crash recovery hold on a different filesystem and scheduler.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------- build
  build:
    name: build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            artifact: skynet-linux-x86_64
            binary: skynet
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            artifact: skynet-linux-clang
            binary: skynet
          - name: linux-tcc
            os: ubuntu-latest
            cc: tcc
            artifact: skynet-linux-tcc
            binary: skynet
          - name: windows-mingw
            os: windows-latest
            cc: gcc
            artifact: skynet-windows-x86_64
            binary: skynet.exe
          - name: macos-clang
            os: macos-latest
            cc: clang
            artifact: skynet-macos
            binary: skynet

    steps:
      - uses: actions/checkout@v4

      - name: install tcc (linux only)
        if: matrix.cc == 'tcc'
        run: sudo apt-get update && sudo apt-get install -y tcc

      # tcc accepts a reduced flag set; -std=c89 is not supported by it, so
      # the portability check uses plain -Wall and relies on the sources
      # being C89 rather than on the compiler enforcing it.
      - name: build (tcc)
        if: matrix.cc == 'tcc'
        run: tcc -Wall -Isrc -o ${{ matrix.binary }} src/main.c src/sk_math.c src/sk_arena.c src/sk_clock.c src/sk_vault.c src/sk_sched.c src/sk_io.c src/sk_mem.c src/sk_tensor.c src/sk_forward.c src/sk_selftest.c

      - name: build (strict)
        if: matrix.cc != 'tcc'
        shell: bash
        run: |
          set -e
          ${{ matrix.cc }} -std=c89 -pedantic -Wall -Wextra -Werror -O2 \
            -Isrc -o ${{ matrix.binary }} \
            src/main.c src/sk_math.c src/sk_arena.c src/sk_clock.c \
            src/sk_vault.c src/sk_sched.c src/sk_io.c src/sk_mem.c src/sk_tensor.c src/sk_forward.c src/sk_selftest.c

      - name: selftest
        shell: bash
        run: |
          set -e
          ./${{ matrix.binary }} selftest
          echo "selftest passed on ${{ matrix.name }}"

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # ------------------------------------------------------------ 32-bit
  # This job exists because "long is exactly 32 bits" is the single most
  # load-bearing assumption in the code, and until now it was only checked
  # by compiling, never by running.
  build-32bit:
    name: build / linux-32bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install multilib
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: build 32-bit
        run: |
          set -e
          # build/verify is needed by the crash test, so build it too
          make all CFLAGS="-std=c89 -pedantic -Wall -Wextra -Werror -O2"
          make 32 CFLAGS="-std=c89 -pedantic -Wall -Wextra -Werror -O2"

      - name: selftest 32-bit
        run: |
          set -e
          file build/skynet32
          ./build/skynet32 selftest

      - name: crash test 32-bit
        run: |
          set -e
          cp build/skynet32 skynet
          sh tests/crash_test.sh 6

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: skynet-linux-i386
          path: build/skynet32
          if-no-files-found: error

  # ---------------------------------------------------------- crash test
  crash-test:
    name: crash recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: make all CFLAGS="-std=c89 -pedantic -Wall -Wextra -Werror -O2"

      - name: selftest
        run: ./skynet selftest

      - name: crash test (15 kills)
        run: sh tests/crash_test.sh 15

      - name: crash test (durable mode, survives power loss)
        run: |
          set -e
          rm -rf build/dur && mkdir -p build/dur
          ./skynet run --quiet --durable --max 5000 \
            --dir build/dur/state --out build/dur/p.txt
          ./build/verify build/dur/p.txt
          echo "durable mode ok"

      - name: recover after simulated corrupt slot
        run: |
          set -e
          rm -rf build/rec && mkdir -p build/rec
          ./skynet run --quiet --max 3000 --dir build/rec/state --out build/rec/p.txt
          ./skynet run --quiet --max 6000 --dir build/rec/state --out build/rec/p.txt
          # damage one slot the way a bad sector would.
          # octal escapes, not \x: /bin/sh is dash on Ubuntu and does not
          # understand \xNN in printf.
          f=$(ls build/rec/state/STATE.* | head -1)
          printf '\336\255\276\357' | dd of="$f" bs=1 seek=30 conv=notrunc status=none
          echo "damaged $f, expecting recovery from the other slot"
          ./skynet recover --dir build/rec/state

  # ------------------------------------------------------------- linting
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build (the model checks below run the binary)
        run: make all CFLAGS="-std=c89 -pedantic -Wall -Wextra -Werror -O2"

      # The invariants in docs/01-architecture.md are only real if they are
      # enforced.  This checker strips comments and string literals before
      # looking for banned tokens, so it does not fire on the comments that
      # explain why those tokens are banned.
      - name: enforce core invariants
        run: python3 tools/hygiene.py -v

      - name: platform detection is written once
        run: |
          set -e
          # The same bug shipped twice: platform macros were derived in two
          # places and drifted, once making sk_io.c compile its POSIX branch
          # on DOS, once making sk_mem.c report "not a DOS target". The rule
          # that prevents a third time is mechanical, so it is checked.
          bad=0
          for f in src/*.c src/*.h; do
            case "$f" in
              src/sk_plat.h) continue ;;
            esac
            if grep -qE 'defined\((MSDOS|__DOS__|__WATCOMC__|__TURBOC__)\)' "$f"; then
              echo "::error file=$f::derives the platform itself; include sk_plat.h instead"
              bad=1
            fi
          done
          test "$bad" = 0
          echo "platform detection lives only in src/sk_plat.h"

      - name: the checker is not a no-op
        run: |
          set -e
          # A check that cannot fail protects nothing.  Prove it bites.
          printf '/* t */\n#include <math.h>\nint f(void){ double x=1.0; // c\n return (int)rand()+(int)x; }\n' > src/sk_zz_probe.c
          if python3 tools/hygiene.py; then
            echo "::error::hygiene.py passed on a deliberately bad file"
            rm -f src/sk_zz_probe.c
            exit 1
          fi
          rm -f src/sk_zz_probe.c
          python3 tools/hygiene.py
          echo "checker catches float, rand, math.h and // comments"

      - name: the integer types are exactly 32 bits
        run: |
          set -e
          # On Linux x86-64 `long` is 64 bits, so `unsigned long` is the
          # wrong type for a 32-bit word. sk_types.h picks int or long from
          # <limits.h> and proves the choice with a compile-time assertion;
          # this step proves the assertion is actually reached and correct.
          cc -std=c89 -pedantic -Wall -Wextra -Werror -Isrc -o build_sizes tests/sizes.c
          ./build_sizes
          ./build_sizes | grep -q 'sk_u32=4 sk_i32=4 sk_fix=4' || {
            echo "::error::sk_u32 is not 32 bits on this platform"
            exit 1
          }
          echo "32-bit types confirmed"

      - name: docs exist
        run: |
          set -e
          for f in README.md LICENSE docs/00-index.md docs/01-architecture.md \
                   docs/20-ideas.md PROMPT.md; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "documentation present"

      - name: logo regenerates identically
        run: |
          set -e
          python3 tools/make_logo.py
          git diff --exit-code assets/ || {
            echo "::error::assets/ is out of date, run tools/make_logo.py"
            exit 1
          }
          echo "logo is reproducible from the prime sequence"

      - name: TNY2 model import
        run: |
          set -e
          # The released TINY.BIN is the M2 baseline. Loading it must
          # reproduce the same weight bytes and a dense matvec result.
          OUT=$(./skynet model refs/Tiny-2.1-main/dos/TINY.BIN)
          echo "$OUT"
          case "$OUT" in
            *"D=96 L=4 H=4 HID=256 HD=24"*) ;;
            *) echo "::error::unexpected model shape"; exit 1 ;;
          esac
          case "$OUT" in
            *"MATCH"*) ;;
            *) echo "::error::weights do not round-trip through the store"; exit 1 ;;
          esac
          case "$OUT" in
            *"96/96 non-zero"*) ;;
            *) echo "::error::matvec produced a degenerate result"; exit 1 ;;
          esac

      - name: cross-check the matvec against a float reference
        run: |
          set -e
          # Two implementations of the same wrong idea agree with each
          # other, so the fixed-point matvec is compared against Python
          # floats, not against itself.
          python3 tools/check_matvec.py | tee /tmp/ref.txt
          PEAK=$(grep 'peak as Q16.16' /tmp/ref.txt | awk '{print $NF}')
          OUR=$(./skynet model refs/Tiny-2.1-main/dos/TINY.BIN | grep matvec | sed 's/.*peak |y| = //')
          python3 tools/compare_peak.py "$PEAK" "$OUR"

      - name: the model matches the released implementation
        run: |
          set -e
          # tests/ref_tiny.c is the ORIGINAL Tiny-2.1 forward pass compiled
          # for the host. Comparing the fixed-point port against my own
          # float rewrite would only prove I made the same mistake twice.
          #
          # The script sweeps ALL 26 single letters, not a spot check: the
          # quantiser overflow it guards against broke 8 of 26 letters while
          # every longer prompt looked fine.
          sh tools/verify_model.sh

  # --------------------------------------------------------------- dos
  # DOS is the real target, so it gets a real 16-bit compiler AND a real
  # run.  These are two different claims - "it compiles" and "it works" -
  # and both are needed, but they live in one job on purpose: splitting
  # them means passing the .exe through an artifact, and a job that
  # downloads a missing artifact fails with a message that says nothing
  # about the actual cause.
  #
  # Why a tarball and not a container: there is no published OpenWatcom
  # image on ghcr.io (the first version of this job tried one and failed
  # with "not found").  Upstream publishes a snapshot tarball, which needs
  # no registry, no docker daemon and no credentials.
  dos:
    name: dos / 16-bit build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cache OpenWatcom
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ow.tar.xz
          # 'Current-build' is rebuilt upstream periodically, so this cache
          # can go stale in a harmless way: an older snapshot still compiles.
          key: openwatcom-snapshot-v1

      - name: install DOSBox
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox

      - name: build 16-bit DOS binary
        run: |
          set -e
          # The whole procedure lives in tools/test_watcom.sh, which is what
          # was run and debugged by hand.  CI calls the same script so the
          # two cannot drift apart: wcc compiles one file per invocation,
          # the snapshot ships host binaries for many platforms, and wlink
          # needs a `file` directive per object.  All three were found only
          # because this script could be run outside CI.
          WORK="$RUNNER_TEMP" sh tools/test_watcom.sh
          ls -la build_dos/skynet.exe

      - name: build the host verifier
        run: make all CFLAGS="-std=c89 -pedantic -Wall -Wextra -Werror -O2"

      - name: DOS acceptance test
        run: |
          set -e
          # Runs the 16-bit binary in DOSBox and checks what only the real
          # target can show: real-mode loading, a 16-bit size_t not
          # truncating an 8 MB arena request, the vault working without
          # fsync, and recovery resuming from a previous process's state.
          sh tests/dos_test.sh

      - name: upload DOS binary
        uses: actions/upload-artifact@v4
        with:
          name: skynet-dos-16bit
          path: build_dos/skynet.exe
          if-no-files-found: error
